name: cinference-4090-port

on:
  push:
    branches:
      - cinference-4090-port
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinference-4090-port
  cancel-in-progress: true

jobs:
  validate-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Checkout pinned Cinference
        uses: actions/checkout@v4
        with:
          repository: satellitedown/cinference
          ref: 2205806b3e9d12b23673a146eab1d36755ebc3a0
          fetch-depth: 0
          path: upstream

      - name: Syntax-check overlay
        run: python -m py_compile ports/cinference-4090/apply_port.py

      - name: Apply RTX 4090 overlay
        working-directory: upstream
        run: python ../ports/cinference-4090/apply_port.py

      - name: Verify port invariants
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'CMAKE_CUDA_ARCHITECTURES 89' CMakeLists.txt
          grep -q 'CMAKE_CUDA_ARCHITECTURES STREQUAL "89"' CMakeLists.txt
          ! grep -q 'STREQUAL "120a"' CMakeLists.txt
          grep -q -- '--cuda-gpu-arch=sm_89' .clangd
          grep -q 'compute_capability() != 89' src/models/qwen3_5/program/planning/startup.cpp
          grep -q 'draft_tokens > 10' src/product/speculative_options.h
          grep -q 'kMtpDecodeMaximumDrafts    = 10' src/models/qwen3_5/program/round_buffers.h
          grep -q 'topology_signature' src/core/decode_graph.cpp
          grep -q 'mma.sync.aligned.m16n8k32.row.col.f32.e4m3.e4m3.f32' src/ops/common/mma.cuh
          grep -q 'encode_nvfp4_e2m1' src/ops/linear/nvfp4/nvfp4_codec.cuh
          ! grep -q '#include <cuda_fp4.h>' src/ops/linear/nvfp4/nvfp4_codec.cuh
          ! grep -q '__nv_fp4x2_e2m1' src/ops/kv_cache/nvfp4_group16_codec.cuh
          grep -q 'sm89_blackwell_stubs.cu' src/ops/CMakeLists.txt
          test -f src/ops/sm89_blackwell_stubs.cu
          grep -q 'launch_nvfp4_linear_swiglu_w4a4_tma' src/ops/sm89_blackwell_stubs.cu
          grep -q 'launch_t4_ada' src/ops/gdn_input_proj/q4_q5/q4_q5_gdn_input_independent.cu
          ! grep -q 'core/pdl.cuh' src/ops/gdn_input_proj/q4_q5/q4_q5_gdn_input_independent.cu
          ! grep -q 'launch_t4_pdl' src/ops/gdn_input_proj/q4_q5/q4_q5_gdn_input_independent.cu
          ! grep -q 'nvfp4_w4a4_tma.cu' src/ops/linear/nvfp4/sources.cmake
          ! grep -q 'nvfp4_linear_swiglu_w4a4_tma.cu' src/ops/linear_swiglu/sources.cmake
           ! grep -q 'prompt_nvfp4_non_rdc.cu' src/ops/softmax_attention/sources.cmake
           # Ada iteration fixes: no PDL/grid-dependency execution on sm_89.
           ! grep -q 'core/pdl.cuh' src/ops/sparse_moe/decode/sparse_moe_decode_kernels.cu
           ! grep -q 'core/pdl.cuh' src/ops/sparse_moe/small_t/sparse_moe_small_t_kernels.cu
           ! grep -q 'pdl::' src/ops/sparse_moe/decode/sparse_moe_decode_kernels.cu
           ! grep -q 'pdl::' src/ops/sparse_moe/small_t/sparse_moe_small_t_kernels.cu
           grep -q 'launch_q4_t1<Publish, false, false, false>' src/ops/gdn_input_proj/q4_q5/q4_q5_gdn_input_conv_snapshot.cu
           grep -q 'launch_q5_t1<Publish, false, false, false>' src/ops/gdn_input_proj/q4_q5/q4_q5_gdn_input_conv_snapshot.cu
           grep -q 'launch_q4_ksplit<Tokens, Q4Schedule, Publish, false, false, false>' src/ops/gdn_input_proj/q4_q5/q4_q5_gdn_input_conv_snapshot.cu
           grep -q 'launch_q5_small_t<Tokens, Publish, false, false, false>' src/ops/gdn_input_proj/q4_q5/q4_q5_gdn_input_conv_snapshot.cu
           test "$(grep -c '(void)Order;' src/ops/gdn_input_proj/q4_q5/q4_q5_gdn_input_conv_snapshot.cu)" = "2"
           # NVFP4 model-weight routes fail closed on Ada.
           for f in src/ops/attn_input_proj/nvfp4/nvfp4_attn_input_w4a4.cu src/ops/gdn_input_proj/nvfp4/nvfp4_gdn_input_w4a4.cu src/ops/linear/nvfp4/nvfp4_dispatch.cpp src/ops/linear/nvfp4/shapes/n14336_k5120.cu src/ops/linear/nvfp4/shapes/n16384_k5120.cu src/ops/linear/nvfp4/shapes/n34816_k5120.cu src/ops/linear/nvfp4/shapes/n5120_k17408.cu src/ops/linear/nvfp4/shapes/n5120_k6144.cu src/ops/linear_add/nvfp4/nvfp4_linear_add_w4a4.cu src/ops/linear_swiglu/nvfp4/nvfp4_linear_swiglu_w4a4.cu; do grep -q 'require Blackwell' "$f"; done
           ! grep -q 'w4a4_tma_route(tokens)' src/ops/attn_input_proj/nvfp4/nvfp4_attn_input_w4a4.cu src/ops/gdn_input_proj/nvfp4/nvfp4_gdn_input_w4a4.cu src/ops/linear_add/nvfp4/nvfp4_linear_add_w4a4.cu
           # Q8 launches configure dynamic shared memory; no raw Q8 kernel launches in .cu files.
           grep -q 'cudaFuncAttributeMaxDynamicSharedMemorySize' src/ops/linear/q8/q8_ksplit_mma.cuh
           grep -q 'cudaFuncAttributeMaxDynamicSharedMemorySize' src/ops/linear/q8/q8_ksplit_grouped_mma.cuh
           grep -q 'cudaFuncAttributeMaxDynamicSharedMemorySize' src/ops/linear/q8/q8_rowsplit_gemm_mma.cuh
           grep -q 'void launch_q8_ksplit_mma' src/ops/linear/q8/q8_ksplit_mma.cuh
           grep -q 'void launch_q8_ksplit_grouped_mma' src/ops/linear/q8/q8_ksplit_grouped_mma.cuh
           grep -q 'void launch_q8_rowsplit_gemm_mma' src/ops/linear/q8/q8_rowsplit_gemm_mma.cuh
           ! grep -rn 'q8_ksplit_mma_kernel<\|q8_ksplit_grouped_mma_kernel<\|q8_rowsplit_gemm_mma_kernel<' --include='*.cu' src/
           for f in src/ops/attn_input_proj/q8/q8_attn_input_gemm_mma.cu src/ops/attn_input_proj/q8/q8_attn_input_gemm_splitk.cu src/ops/attn_input_proj/q8/q8_dflash2_attn_input.cu src/ops/dynamic_grouped_conv/q8/q8_dynamic_grouped_conv_add_materialized.cu src/ops/gdn_input_proj/q8/q8_gdn_input_gemm_mma.cu src/ops/gdn_input_proj/q8/q8_gdn_input_gemm_splitk.cu src/ops/linear/q8/q8_ksplit_launch.cuh src/ops/linear/q8/q8_rowsplit_gemm_mma.cu src/ops/linear/q8/shapes/n2048_k16384.cu src/ops/linear/q8/shapes/n5120_k25600.cu src/ops/linear_add/q8/q8_linear_add_gemm_grouped.cu src/ops/linear_add/q8/q8_linear_add_gemm_mma.cu src/ops/linear_add/q8/q8_linear_add_gemm_splitk.cu src/ops/linear_pair/q8/q8_pair_gemm_concat.cu src/ops/linear_pair/q8/q8_pair_gemm_splitk.cu src/ops/linear_swiglu/q8/q8_dflash2_linear_swiglu.cu src/ops/linear_swiglu/q8/q8_linear_swiglu_gemm_mma.cu src/ops/linear_swiglu/q8/q8_linear_swiglu_gemm_splitk.cu; do grep -q 'launch_q8_' "$f"; done
           # Preserved contracts: MTP maximum, topology signature, K8V4 software codec.
           grep -q 'draft_tokens > 10' src/product/speculative_options.h
           grep -q 'kMtpDecodeMaximumDrafts    = 10' src/models/qwen3_5/program/round_buffers.h
           grep -q 'topology_signature' src/core/decode_graph.cpp
           grep -q 'encode_nvfp4_e2m1' src/ops/linear/nvfp4/nvfp4_codec.cuh
           git diff --check

      - name: Materialize patched source branch
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "port: retarget Cinference to RTX 4090 Ada"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/cinference-4090-source

  compile-sm89:
    needs: validate-overlay
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev

      - name: Checkout materialized RTX 4090 source
        uses: actions/checkout@v4
        with:
          ref: cinference-4090-source
          fetch-depth: 1

      - name: Configure sm89
        shell: bash
        run: |
          cmake -S . -B build-sm89 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=89 \
            -DNINFER_BUILD_APPS=OFF \
            -DBUILD_TESTING=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF

      - name: Compile sm89
        shell: bash
        run: cmake --build build-sm89 -j2
