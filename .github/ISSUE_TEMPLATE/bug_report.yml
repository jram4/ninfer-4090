name: Bug report
description: Report a reproducible problem on the supported RTX 4090/Linux target
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, request contents, private model paths, or proprietary weights.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release tag
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, kernel, RTX 4090 model, driver, CUDA, compiler, and CMake versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal command and sanitized input needed to reproduce the problem
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already run
